function grantPill(double=false){let a=choice(pillPool);say((double?'HORSE PILL: ':'PILL: ')+a[0]);a[2](player);if(double){a[2](player);say('HORSE PILL: '+a[0]+' x2')}}

function pickup(p){if(p.type==='item'||p.type==='shopitem'||p.type==='dealitem'){if(p.type==='shopitem'&&player.coins<5){say('Need 5 coins!');return}if(p.type==='shopitem')player.coins-=5;if(p.type==='dealitem'&&player.hp<2){say('Not enough hearts to trade!');return}if(p.type==='dealitem')player.hp=Math.max(1,player.hp-1);applyItem(p.item);p.gone=true}else if(p.type==='coin'){player.coins+=p.value||1;p.gone=true;sound(700,.07,'square')}else if(p.type==='heart'){player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true}else if(p.type==='bomb'){player.bombs++;p.gone=true}else if(p.type==='goldbomb'){player.goldenBombs++;player.bombs++;p.gone=true;say('Golden bomb!')}else if(p.type==='key'){player.keys++;p.gone=true}else if(p.type==='goldkey'){player.goldenKeys++;player.keys++;p.gone=true;say('Golden key!')}else if(p.type==='pill'||p.type==='horse'){if(player.pill){say('Pill slot full!');return}player.pill={horse:p.type==='horse'};p.gone=true;say(p.type==='horse'?'Horse pill':'Pill')}else if(p.type==='card'){if(player.card){say('Card slot full!');return}player.card=choice(cardPool);p.gone=true;say('Card: '+player.card[0])}else if(p.type==='trinket'){if(player.trinket){say('Trinket slot full!');return}player.trinket=choice(trinketPool);player.trinket[2](player);p.gone=true;say('Trinket: '+player.trinket[0])}}

function fire(){if(player.character===4||player.brimstone){if(player.beam)return;player.charge=(player.charge||0)+1;if(player.charge>=34&&!player.beam&&(player.cool||0)<=0){let a=aim.angle;player.face=a;player.beam={angle:a,life:19,tick:0};player.cool=48;player.charge=0;sound(95,.28,'sawtooth',.055);for(let i=0;i<12;i++)particles.push({x:player.x+Math.cos(a)*rand(18,75),y:player.y+Math.sin(a)*rand(18,75),vx:rand(-1,1),vy:rand(-1,1),life:rand(8,18),r:rand(2,6),color:'#d8b4ff'})}return}if(player.cool>0)return;player.cool=player.fireRate;let a=aim.angle;player.face=a;let count=player.multiShot;for(let i=0;i<count;i++){let ang=a+(i-(count-1)/2)*.16;shots.push({x:player.x+Math.cos(ang)*17,y:player.y+Math.sin(ang)*17,vx:Math.cos(ang)*player.shotSpeed,vy:Math.sin(ang)*player.shotSpeed,r:player.bulletSize,damage:player.damage+(player.coinPower?player.coins*.025:0),life:90,pierce:player.piercing,hit:[]})}sound(340,.045,'triangle',.025)}

function damagePlayer(){if(player.invuln>0)return;if(player.armor&&Math.random()<.5){say('The Wafer softened the hit!');player.invuln=35;return}player.hp--;player.invuln=75;shake=10;sound(90,.2,'sawtooth');if(player.hp<=0){if(player.secondChance){player.secondChance=false;player.hp=2;player.maxHp=Math.max(player.maxHp,2);say('Second chance!');}else{state='dead';showDead()}}}
function update(dt){if(state!=='play')return;frame++;let r=rooms[roomKey(current.x,current.y)];player.cool=Math.max(0,(player.cool||0)-dt);player.invuln=Math.max(0,player.invuln-dt);player.walk+=dt;let vx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),vy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);let l=Math.hypot(vx,vy)||1;let nx=player.x+vx/l*player.speed*dt,ny=player.y+vy/l*player.speed*dt;if(vx||vy){player.moveFace=Math.atan2(vy,vx);if(!mouse.down&&!keys.Space)player.face=player.moveFace;}let doors=getDoors(),open=r.cleared;let passTop=open&&doors.some(d=>d.side==='top')&&Math.abs(nx-480)<43,passBottom=open&&doors.some(d=>d.side==='bottom')&&Math.abs(nx-480)<43,passLeft=open&&doors.some(d=>d.side==='left')&&Math.abs(ny-300)<43,passRight=open&&doors.some(d=>d.side==='right')&&Math.abs(ny-300)<43;player.x=clamp(nx,ROOM.x+13,ROOM.x+ROOM.w-13);player.y=clamp(ny,ROOM.y+13,ROOM.y+ROOM.h-13);if(!passTop&&player.y<ROOM.y+22)player.y=ROOM.y+22;if(!passBottom&&player.y>ROOM.y+ROOM.h-22)player.y=ROOM.y+ROOM.h-22;if(!passLeft&&player.x<ROOM.x+22)player.x=ROOM.x+22;if(!passRight&&player.x>ROOM.x+ROOM.w-22)player.x=ROOM.x+ROOM.w-22;
if(mouse.down||keys.Space)fire();else if(player.character===4)player.charge=0;if(player.beam){player.beam.life-=dt;player.beam.tick-=dt;if(player.beam.tick<=0){player.beam.tick=4;let a=player.beam.angle;for(let e of enemies){let dx=e.x-player.x,dy=e.y-player.y,along=dx*Math.cos(a)+dy*Math.sin(a),side=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));if(along>0&&along<300&&side<19+e.r)hurt(e,player.damage*.42)}}if(player.beam.life<=0){player.beam=null;player.charge=0}}for(let d of doors){let x=480,y=300;if(d.side==='top')y=ROOM.y+13;if(d.side==='bottom')y=ROOM.y+ROOM.h-13;if(d.side==='left')x=ROOM.x+13;if(d.side==='right')x=ROOM.x+ROOM.w-13;if(r.cleared&&Math.hypot(player.x-x,player.y-y)<27){transition(d);break}}
for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(player.homing&&enemies.length){let target=enemies.reduce((a,b)=>dist(s,b)<dist(s,a)?b:a,enemies[0]);let a=Math.atan2(target.y-s.y,target.x-s.x);s.vx+=(Math.cos(a)*.14);s.vy+=(Math.sin(a)*.14);let m=Math.hypot(s.vx,s.vy);s.vx=s.vx/m*player.shotSpeed;s.vy=s.vy/m*player.shotSpeed}for(let e of enemies){if(e.hp>0&&!s.hit.includes(e)&&Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){hurt(e,s.damage);s.hit.push(e);if(!s.pierce)s.life=0;if(player.split&&Math.random()<.5){for(let a of [-.5,.5])shots.push({x:s.x,y:s.y,vx:s.vx*Math.cos(a)-s.vy*Math.sin(a),vy:s.vx*Math.sin(a)+s.vy*Math.cos(a),r:3,damage:s.damage*.45,life:45,hit:[]})}}}}shots=shots.filter(s=>s.life>0&&s.x>ROOM.x&&s.x<ROOM.x+ROOM.w&&s.y>ROOM.y&&s.y<ROOM.y+ROOM.h);
for(let e of enemies){if(e.hp<=0)continue;e.phase+=.025*dt;e.cool-=dt;e.hit=Math.max(0,e.hit-dt);let a=Math.atan2(player.y-e.y,player.x-e.x),d=dist(e,player);if(e.type==='spitter'||e.type==='boss'){if(d>155){e.x+=Math.cos(a)*e.speed*.45*dt;e.y+=Math.sin(a)*e.speed*.45*dt}else{e.x+=Math.cos(a+Math.PI/2)*Math.sin(e.phase)*e.speed*.7*dt;e.y+=Math.sin(a+Math.PI/2)*Math.sin(e.phase)*e.speed*.7*dt}if(e.cool<=0){e.cool=e.type==='boss'?55:100;let n=e.type==='boss'?7:1;for(let i=0;i<n;i++){let ang=e.type==='boss'?i*Math.PI*2/n:a;foeShots.push({x:e.x,y:e.y,vx:Math.cos(ang)* (e.type==='boss'?3.1:2.8),vy:Math.sin(ang)*(e.type==='boss'?3.1:2.8),r:6,life:180})}}}else{e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}if(d<e.r+player.r&&player.invuln<=0)damagePlayer()}

for(let p of pickups){p.spin=(p.spin||0)+.04*dt;if(p.type==='placedbomb'||p.type==='trollbomb'){p.fuse-=dt;if(p.fuse<=0){for(let e of enemies)if(Math.hypot(e.x-p.x,e.y-p.y)<115)hurt(e,player.bombPower?100:65);if(Math.hypot(player.x-p.x,player.y-p.y)<75)damagePlayer();for(let i=0;i<18;i++)particles.push({x:p.x,y:p.y,vx:rand(-4,4),vy:rand(-4,4),life:24,r:rand(2,6),color:'#f2a45d'});p.gone=true;say('BOOM!')}}else if(Math.hypot(p.x-player.x,p.y-player.y)<28)pickup(p)}pickups=pickups.filter(p=>!p.gone);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(r.type==='boss'&&r.cleared&&!pickups.some(p=>p.type==='hatch'))pickups.push({x:480,y:380,type:'hatch'});for(let p of pickups)if(p.type==='hatch'&&Math.hypot(p.x-player.x,p.y-player.y)<35){nextFloor()};if(toastTime>0)toastTime-=dt;if(shake>0)shake*=.85;
}

function showMenu(){state='menu';overlay.classList.remove('hidden');menu.innerHTML=`<div class="logo">TEARBOUND</div><div class="sub">A HAND-DRAWN DESCENT</div><div style="font:italic 13px Georgia;color:#765e45;margin:4px 0 16px">A little page from a very dark place...</div><button class="btn" id="start">✦ NEW GAME ✦</button><button class="btn" id="continue" ${player?'':'disabled style="opacity:.45"'}>CONTINUE</button><button class="btn" id="ach">ACHIEVEMENTS</button><button class="btn" id="opts">OPTIONS</button><p class="muted">An original roguelike adventure. Every descent is different.</p>`;document.getElementById('start').onclick=showSelect;document.getElementById('continue').onclick=()=>{if(player){state='play';overlay.classList.add('hidden')}};document.getElementById('ach').onclick=()=>{menu.innerHTML=`<div class="logo">ACHIEVEMENTS</div><p class="muted">Your story is just beginning. Defeat floor bosses to fill your completion page in a future update.</p><button class="btn" id="back">BACK</button>`;document.getElementById('back').onclick=showMenu};document.getElementById('opts').onclick=()=>{menu.innerHTML=`<div class="logo">OPTIONS</div><div class="settings-row"><label>Master volume</label><input id="mv" type="range" min="0" max="1" step=".05" value="${settings.volume}"></div><div class="settings-row"><label>Music</label><input id="mo" type="checkbox" ${settings.musicOn?'checked':''}></div><div class="settings-row"><label>Mobile controls</label><input id="mc" type="checkbox" ${settings.mobileOn?'checked':''}></div><button class="btn" id="back">BACK</button>`;document.getElementById('mv').oninput=e=>{settings.volume=+e.target.value;saveSettings()};document.getElementById('mo').onchange=e=>{settings.musicOn=e.target.checked;saveSettings()};document.getElementById('mc').onchange=e=>{settings.mobileOn=e.target.checked;saveSettings()};document.getElementById('back').onclick=showMenu}}
function showSelect(){selected=0;renderSelect()}
function renderSelect(){let c=chars[selected],ratings=[Math.max(1,Math.round(c[4]*3)),Math.max(1,Math.round(c[3])),Math.max(1,Math.round(c[2])),3,3,selected===2?4:2];let labels=['Damage','Health','Speed','Range','Tear rate','Luck'];menu.innerHTML=`<div class="logo" style="font-size:34px">CHOOSE YOUR CHARACTER</div><div class="sub">A new descent begins</div><div class="grid">${chars.map((v,i)=>`<div class="char ${selected===i?'selected':''}" data-id="${i}"><b>${v[0]}</b><small>${v[1]}</small></div>`).join('')}</div><div class="char-preview"><div class="char-doll">${['👶','🎀','🩹','🖤','😈','❔','👻','🩸','🧟'][selected]}</div><div style="flex:1"><b style="font: bold 20px Georgia">${c[0]}</b><div style="font-size:12px;color:#715b43">${c[1]}</div>${labels.map((n,i)=>`<div class="statline"><span>${n}</span><span class="tally">${'Ⅰ'.repeat(Math.min(5,ratings[i]))}</span></div>`).join('')}<div style="font-size:12px;margin-top:5px">Starting gift: ${selected===4?'Brimstone':selected===1?'Extra heart':selected===3?'Dark power':'A unique beginning'}</div></div></div><button class="btn" id="begin">✦ START DESCENT ✦</button><button class="btn" id="back">BACK</button>`;menu.querySelectorAll('.char').forEach(el=>el.onclick=()=>{selected=+el.dataset.id;renderSelect()});document.getElementById('begin').onclick=()=>startRun(selected);document.getElementById('back').onclick=showMenu}
function startRun(id){player=newPlayer(id);floor=0;runStats={kills:0,items:0};makeFloor();state='play';overlay.classList.add('hidden');sound(440,.15);startMusic()}
function saveSettings(){try{localStorage.setItem('tearboundSettings',JSON.stringify(settings))}catch(e){}document.body.classList.toggle('mobile-disabled',!settings.mobileOn);if(musicClock){clearInterval(musicClock);musicClock=null}if(settings.musicOn&&settings.music>0&&state==='play')startMusic()}
function showPause(){state='pause';overlay.classList.remove('hidden');renderPause()}
function renderPause(){menu.innerHTML=`<div class="logo" style="font-size:42px">PAUSED</div><button class="btn" id="resume">RESUME</button><div class="settings-row"><label for="masterVolume">Master volume</label><input id="masterVolume" type="range" min="0" max="1" step="0.05" value="${settings.volume}"><span class="setting-value" id="masterValue">${Math.round(settings.volume*100)}%</span></div><div class="settings-row"><label for="sfxVolume">Sound effects</label><input id="sfxVolume" type="range" min="0" max="1" step="0.05" value="${settings.sfx}"><span class="setting-value" id="sfxValue">${Math.round(settings.sfx*100)}%</span></div><div class="settings-row"><label for="musicVolume">Music volume</label><input id="musicVolume" type="range" min="0" max="1" step="0.05" value="${settings.music}"><span class="setting-value" id="musicValue">${Math.round(settings.music*100)}%</span></div><div class="settings-row"><label for="musicOn">Music enabled</label><input id="musicOn" type="checkbox" ${settings.musicOn?'checked':''}></div><div class="settings-row"><label for="mobileOn">Mobile controls</label><input id="mobileOn" type="checkbox" ${settings.mobileOn?'checked':''}></div><button class="btn" id="restart">RESTART RUN</button><button class="btn" id="quit">MAIN MENU</button><p class="muted">Settings are saved on this device.</p>`;
document.getElementById('resume').onclick=()=>{state='play';overlay.classList.add('hidden');if(settings.musicOn&&settings.music>0)startMusic()};document.getElementById('restart').onclick=showSelect;document.getElementById('quit').onclick=showMenu;
const master=document.getElementById('masterVolume'),sfx=document.getElementById('sfxVolume'),mus=document.getElementById('musicVolume');master.oninput=()=>{settings.volume=+master.value;document.getElementById('masterValue').textContent=Math.round(settings.volume*100)+'%';saveSettings()};sfx.oninput=()=>{settings.sfx=+sfx.value;document.getElementById('sfxValue').textContent=Math.round(settings.sfx*100)+'%';saveSettings()};mus.oninput=()=>{settings.music=+mus.value;document.getElementById('musicValue').textContent=Math.round(settings.music*100)+'%';saveSettings()};document.getElementById('musicOn').onchange=e=>{settings.musicOn=e.target.checked;saveSettings()};document.getElementById('mobileOn').onchange=e=>{settings.mobileOn=e.target.checked;saveSettings()};} 
function showDead(){overlay.classList.remove('hidden');menu.innerHTML=`<div class="logo">RUN ENDED</div><p class="muted">The hollow keeps its secrets. Every descent teaches you something.</p><p>Kills: ${runStats.kills} · Relics: ${runStats.items} · Reached: ${floors[floor].name}</p><button class="btn" id="again">TRY AGAIN</button><button class="btn" id="menuBtn">MAIN MENU</button>`;document.getElementById('again').onclick=showSelect;document.getElementById('menuBtn').onclick=showMenu}
function showWin(){overlay.classList.remove('hidden');menu.innerHTML=`<div class="logo">THE LIGHT RETURNS</div><p class="muted">You crossed every floor and reached the end of the hollow.</p><p>Kills: ${runStats.kills} · Relics: ${runStats.items}</p><button class="btn" id="again">PLAY AGAIN</button><button class="btn" id="menuBtn">MAIN MENU</button>`;document.getElementById('again').onclick=showSelect;document.getElementById('menuBtn').onclick=showMenu}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Tab'){e.preventDefault();mapOpen=!mapOpen}if(e.key==='Escape'&&state==='play')showPause();if(e.key===' '&&state==='play')e.preventDefault();if(state==='play'&&e.key.toLowerCase()==='q'){if(player.card)useCard();else usePill()}if(state==='play'&&e.key.toLowerCase()==='e')useBomb()});window.addEventListener('keyup',e=>keys[e.key]=false);
function point(e){let b=canvas.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height;if(player){let dx=mouse.x-player.x,dy=mouse.y-player.y,len=Math.hypot(dx,dy)||1;aim.x=dx/len;aim.y=dy/len;aim.angle=Math.atan2(aim.y,aim.x)}}
canvas.addEventListener('pointermove',point);canvas.addEventListener('pointerdown',e=>{point(e);if(e.pointerType!=='touch')mouse.down=true});canvas.addEventListener('pointerup',()=>{mouse.down=false});
// Touchscreen controls: a floating-feel movement stick plus four-direction tear buttons.
const stickBase=document.getElementById('stickBase'),stickKnob=document.getElementById('stickKnob');let stickId=null,stickRect=null;
function stickMove(e){if(stickId!==e.pointerId)return;let r=stickBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=48,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}stickKnob.style.transform=`translate(${dx}px,${dy}px)`;keys.d=dx>12;keys.a=dx< -12;keys.s=dy>12;keys.w=dy< -12}
stickBase.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stickBase.setPointerCapture(e.pointerId);stickMove(e)});stickBase.addEventListener('pointermove',stickMove);function releaseStick(e){if(stickId!==e.pointerId)return;stickId=null;stickKnob.style.transform='';keys.w=keys.a=keys.s=keys.d=false}stickBase.addEventListener('pointerup',releaseStick);stickBase.addEventListener('pointercancel',releaseStick);
function bindFire(id,dx,dy){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);aim.x=dx;aim.y=dy;aim.angle=Math.atan2(dy,dx);mouse.x=(player?player.x:480)+dx*300;mouse.y=(player?player.y:300)+dy*300;mouse.down=true;b.dataset.pressed='1'});let up=e=>{mouse.down=false;b.dataset.pressed='0'};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)}bindFire('fireUp',0,-1);bindFire('fireDown',0,1);bindFire('fireLeft',-1,0);bindFire('fireRight',1,0);document.getElementById('useBtn').addEventListener('click',()=>{if(player){if(player.card)useCard();else usePill()}});document.getElementById('bombBtn').addEventListener('click',()=>{if(player)useBomb()});document.getElementById('mapBtn').addEventListener('click',()=>{mapOpen=!mapOpen});document.getElementById('pauseBtn').addEventListener('click',()=>{if(state==='play')showPause();else if(state==='pause'){state='play';overlay.classList.add('hidden')}});
document.body.classList.toggle('mobile-disabled',!settings.mobileOn);showMenu();requestAnimationFrame(loop);
window.addEventListener('error',e=>{overlay.classList.remove('hidden');let msg=String(e.message||'Unknown error'),where=(e.filename?e.filename.split('/').pop():'')+(e.lineno?':'+e.lineno:'');menu.innerHTML='<div class="logo" style="font-size:34px">TEARBOUND ERROR</div><p class="muted">The game hit an error. Reload the page. If it happens again, send these details.</p><p class="muted" style="overflow-wrap:anywhere">'+(msg+' '+where).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});window.addEventListener('unhandledrejection',e=>{overlay.classList.remove('hidden');menu.innerHTML='<div class="logo">TEARBOUND ERROR</div><p class="muted">'+String(e.reason&&e.reason.message||e.reason||'Unexpected async error').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});
})();
</script></body></html>
