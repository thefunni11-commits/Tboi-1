function withLostHealthLocked(fn){let lost=player&&player.character===6,hs=lost?{hp:player.hp,maxHp:player.maxHp,soulHp:player.soulHp,blackHearts:player.blackHearts}:null;fn();if(lost){player.hp=hs.hp;player.maxHp=hs.maxHp;player.soulHp=hs.soulHp;player.blackHearts=hs.blackHearts}}
function grantPill(double=false){let a=choice(pillPool);say((double?'HORSE PILL: ':'PILL: ')+a[0]);withLostHealthLocked(()=>{a[2](player);if(double)a[2](player)});if(double)say('HORSE PILL: '+a[0]+' x2')}

function openChest(p){
  if(p.type==='chest'||p.type==='goldchest'){
    if(player.goldenKeys>0)player.goldenKeys--;else if(player.keys>0)player.keys--;else{say('A key is needed!');return}
  }else if(p.type==='stonechest'){
    if(player.bombs>0)player.bombs--;else if(player.goldenBombs>0)player.goldenBombs--;else{say('A bomb is needed!');return}
  }
  p.gone=true;let n=p.type==='goldchest'?3:p.type==='stonechest'?2:2;
  for(let i=0;i<n;i++){
    let roll=Math.random(),t=roll<.25?'coin':roll<.40?'heart':roll<.53?'key':roll<.64?'bomb':roll<.75?'soulheart':roll<.84?'nickel':roll<.94?'card':'trinket';
    dropReward(p.x,p.y,t);
  }
  if(p.type==='goldchest')say('Golden chest opened!');else if(p.type==='stonechest')say('Stone chest cracked!');else say('Chest opened!');sound(620,.16,'triangle');
}
function pickup(p){
 if(player.character===14&&['coin','goldcoin','nickel','dime','heart','soulheart','key','bomb','battery','sack'].includes(p.type)&&Math.random()<.24){let bump=choice(['damage','speed','tears']);if(bump==='damage')player.damage+=.12;else if(bump==='speed')player.speed+=.035;else player.fireRate=Math.max(7,player.fireRate-.35);say('TAINTED CAIN: PICKUP MUTATION!')}
 if(['item','shopitem','dealitem'].includes(p.type)){if(p.type==='shopitem'&&player.coins<(p.price||5)){say('Need '+(p.price||5)+' coins!');return}if(p.type==='shopitem')player.coins-=(p.price||5);if(p.type==='dealitem'&&player.hp<2){say('Not enough hearts to trade!');return}if(p.type==='dealitem')player.hp=Math.max(1,player.hp-1);applyItem(p.item);p.gone=true}
 else if(['chest','goldchest','stonechest'].includes(p.type)){openChest(p)}
 else if(p.type==='coin'||p.type==='nickel'||p.type==='dime'||p.type==='goldcoin'){let value=p.type==='nickel'?5:p.type==='dime'?10:p.type==='goldcoin'?5:(p.value||1);player.coins+=value;p.gone=true;say('+'+value+' coins');sound(700,.07,'square')}
 else if(p.type==='heart'){if(player.character===6){say('The Lost cannot take health!')}else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true;say('Red heart')}else say('Already at full health!')}
 else if(p.type==='doubleheart'){if(player.character===6){say('The Lost cannot take health!')}else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+2);p.gone=true;say('Double heart!')}else say('Already at full health!')}
 else if(p.type==='soulheart'||p.type==='blackheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.soulHp=(player.soulHp||0)+2;if(p.type==='blackheart')player.blackHearts=(player.blackHearts||0)+2;p.gone=true;say(p.type==='blackheart'?'Black heart!':'Soul heart!')}}
 else if(p.type==='eternalheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.maxHp++;player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true;say('Eternal heart!')}}

// ---------------------------------------------------------------------------
// Isaac-style doorways.
// Every door is drawn once in "top wall" space and rotated into place, so all four
// sides share the same art. Design language:
//   - stone frame set into the wall, tinted by the floor theme
//   - a themed emblem on top (crown, coin sign, skull, demon, wings, curse eye)
//   - dark open passage that glows in the room's colour
//   - iron portcullis that drops while enemies are alive
//   - padlocked leaves on a treasure room that has not been unlocked yet
// ---------------------------------------------------------------------------
const DOOR_STYLES={
 normal:{leaf:'#5b4332',band:'#2b2127',stud:'#b99a74',bar:'#6f6670',glow:null},
 treasure:{frame:'#a97a2a',trim:'#f1d17a',leaf:'#6b4a1f',band:'#e3bd5a',stud:'#fff0a8',bar:'#d9b45a',glow:'#ffd86b'},
 shop:{frame:'#7d5230',trim:'#edbd70',leaf:'#5e3b20',band:'#d49a54',stud:'#ffd89a',bar:'#c58a4a',glow:'#ffb35c'},
 boss:{frame:'#4d2630',trim:'#d58a8d',leaf:'#34181f',band:'#a24d5b',stud:'#e0a0a6',bar:'#8b4a55',glow:'#ff5a5a'},
 deal:{frame:'#1d0e15',trim:'#ed4a63',leaf:'#150a10',band:'#7a1830',stud:'#ff4a5e',bar:'#8a1c36',glow:'#ff2e4a'},
 angel:{frame:'#e6e0cf',trim:'#f0cf75',leaf:'#f4efe2',band:'#e8c871',stud:'#fff8d8',bar:'#f0e6c0',glow:'#fff3b0'},
 curse:{frame:'#2a2037',trim:'#b69be8',leaf:'#1a1424',band:'#5c4a80',stud:'#b69be8',bar:'#6a5a8c',glow:'#a47dff'}
};
function doorShade(hex,amt){
 let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
 const n=parseInt(h.slice(0,6),16),r=n>>16,g=(n>>8)&255,b=n&255;
 const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);
 return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
// Which design a room uses. A deal room with .angel or .holy set becomes an angel door.
function doorKindOf(room){
 if(!room)return null;
 if(room.type==='deal'&&(room.angel||room.holy))return 'angel';
 return room.type!=='normal'&&DOOR_STYLES[room.type]?room.type:null;
}
function drawDoorway(d,r,f){
 const target=rooms[roomKey(current.x+d.dx,current.y+d.dy)];
 // Both sides of a connection share the special room's frame, like in Isaac.
 const kind=doorKindOf(target)||doorKindOf(r)||'normal',st=DOOR_STYLES[kind];
 const locked=!!(target&&target.type==='treasure'&&!target.unlocked);
 const want=(r.cleared&&!locked)?1:0;
 if(!r.doorT)r.doorT={};
 if(r.doorT[d.side]===undefined)r.doorT[d.side]=locked?0:1;
 let t=r.doorT[d.side];t+=(want-t)*.16;if(Math.abs(want-t)<.004)t=want;r.doorT[d.side]=t;
 const pulse=.5+.5*Math.sin(frame*.07+d.dx*2+d.dy*3);
 const frameC=st.frame||doorShade(f.wall,.34),trimC=st.trim||f.accent;
 const rot={top:0,bottom:Math.PI,left:-Math.PI/2,right:Math.PI/2}[d.side];
 const cx=d.side==='left'?ROOM.x:d.side==='right'?ROOM.x+ROOM.w:480;
 const cy=d.side==='top'?ROOM.y:d.side==='bottom'?ROOM.y+ROOM.h:300;
 const HW=30,FW=44,TOP=-24,BOT=8,OT=-19,INK='#0a070c';
 const openPath=()=>{ctx.beginPath();ctx.roundRect(-HW,OT,HW*2,BOT-OT,[8,8,0,0])};
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.lineJoin='round';

 // ---- emblem pieces that sit BEHIND the frame ----
 if(kind==='angel'){
  const tones=['#fffaf0','#f1ead8','#e2d8bd'],angs=[-.75,-.45,-.15],lens=[26,31,36];
  for(const s of [-1,1])for(let i=0;i<3;i++){
   ctx.save();ctx.translate(s*8,TOP-3);ctx.scale(s,1);ctx.rotate(angs[i]);
   ctx.fillStyle=tones[i];ctx.strokeStyle='#8c8566';ctx.lineWidth=1.2;
   ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(lens[i]*.5,-9,lens[i],-3);ctx.quadraticCurveTo(lens[i]*.55,4,0,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }
 }
 if(kind==='boss'||kind==='deal'){ // horns
  const hornC=kind==='deal'?'#5a1020':'#cdbf9f';
  for(const s of [-1,1]){
   ctx.fillStyle=hornC;ctx.strokeStyle=INK;ctx.lineWidth=1.6;
   ctx.beginPath();ctx.moveTo(s*5,TOP-2);ctx.quadraticCurveTo(s*19,TOP-4,s*(kind==='deal'?22:19),TOP-(kind==='deal'?26:21));
   ctx.quadraticCurveTo(s*12,TOP-11,s*4,TOP-10);ctx.closePath();ctx.fill();ctx.stroke();
  }
 }
 if(kind==='curse'){ // thorns
  for(let i=-4;i<=4;i++){
   if(Math.abs(i)<2)continue;
   const x=i*9.5,h=9+(i%2?3:0);
   ctx.fillStyle='#3a2b52';ctx.strokeStyle=INK;ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(x-4,TOP+3);ctx.quadraticCurveTo(x-1,TOP-h*.5,x+Math.sign(i)*3,TOP-h);ctx.quadraticCurveTo(x+3,TOP-h*.3,x+4,TOP+3);ctx.closePath();ctx.fill();ctx.stroke();
  }
 }

 // ---- stone frame ----
 ctx.fillStyle='#0006';ctx.beginPath();ctx.roundRect(-FW-3,TOP-2,FW*2+6,BOT-TOP+8,[13,13,4,4]);ctx.fill();
 ctx.fillStyle=frameC;ctx.strokeStyle=INK;ctx.lineWidth=3;
 ctx.beginPath();ctx.roundRect(-FW,TOP,FW*2,BOT-TOP,[11,11,3,3]);ctx.fill();ctx.stroke();
 ctx.strokeStyle=doorShade(frameC,.35);ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-FW+3,BOT-3);ctx.lineTo(-FW+3,TOP+10);ctx.quadraticCurveTo(-FW+3,TOP+3,-FW+11,TOP+3);ctx.lineTo(FW-11,TOP+3);ctx.stroke();
 ctx.strokeStyle=doorShade(frameC,-.45);ctx.lineWidth=1.4;ctx.beginPath();
 for(const s of [-1,1])for(let i=0;i<3;i++){
  const y=TOP+8+i*8,vx=s*(HW+5+(i%2)*4);
  ctx.moveTo(s*(HW+1),y);ctx.lineTo(s*(FW-2),y);ctx.moveTo(vx,y);ctx.lineTo(vx,y+8);
 }
 ctx.stroke();
 // keystone
 ctx.fillStyle=doorShade(frameC,.18);ctx.strokeStyle=INK;ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(-6,TOP+1);ctx.lineTo(6,TOP+1);ctx.lineTo(4.5,OT-1);ctx.lineTo(-4.5,OT-1);ctx.closePath();ctx.fill();ctx.stroke();

 // ---- passage ----
 openPath();ctx.save();ctx.clip();
 let g=ctx.createLinearGradient(0,OT,0,BOT);g.addColorStop(0,'#030206');g.addColorStop(1,'#140e18');
 ctx.fillStyle=g;ctx.fillRect(-HW,OT,HW*2,BOT-OT);
 if(st.glow&&t>.02){
  ctx.globalAlpha=Math.min(1,(.24+.2*pulse)*t*(kind==='angel'?1.9:1));
  const gg=ctx.createLinearGradient(0,OT,0,BOT);gg.addColorStop(0,st.glow+'00');gg.addColorStop(1,st.glow);
  ctx.fillStyle=gg;ctx.fillRect(-HW,OT,HW*2,BOT-OT);ctx.globalAlpha=1;
 }
 if(kind==='deal'&&t>.05){ // inverted pentagram floating in the dark
  ctx.globalAlpha=(.35+.35*pulse)*t;ctx.strokeStyle='#ff3350';ctx.lineWidth=1.1;
  ctx.beginPath();
  for(let k=0;k<=5;k++){const a=Math.PI/2+k*4*Math.PI/5,px=Math.cos(a)*9,py=-5+Math.sin(a)*9;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.stroke();ctx.beginPath();ctx.arc(0,-5,10.5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
 }
 if(kind==='angel'&&t>.05){ // light rays and rising motes
  ctx.globalAlpha=(.35+.25*pulse)*t;
  const rg=ctx.createRadialGradient(0,BOT,2,0,BOT,34);rg.addColorStop(0,'#fffbe0');rg.addColorStop(1,'#fffbe000');
  ctx.fillStyle=rg;ctx.fillRect(-HW,OT,HW*2,BOT-OT);
  ctx.globalAlpha=.9*t;ctx.fillStyle='#fffbe0';
  for(let i=0;i<4;i++){const px=-22+i*14+Math.sin(frame*.05+i)*3,py=BOT-((frame*.35+i*9)%(BOT-OT));ctx.fillRect(px,py,2,2)}
  ctx.globalAlpha=1;
 }
 // padlocked leaves (treasure room that still needs a key)
 if(locked){
  for(const s of [-1,1]){
   const x0=s<0?-HW:0;
   ctx.fillStyle=st.leaf;ctx.fillRect(x0,OT,HW,BOT-OT);
   ctx.strokeStyle='#00000055';ctx.lineWidth=1;ctx.beginPath();
   for(let px=x0+6;px<x0+HW;px+=6){ctx.moveTo(px,OT);ctx.lineTo(px,BOT)}ctx.stroke();
   ctx.fillStyle=st.band;ctx.fillRect(x0,OT+5,HW,3);ctx.fillRect(x0,BOT-9,HW,3);
   ctx.fillStyle=st.stud;
   for(const yy of [OT+6.5,BOT-7.5])for(const sx of [x0+4,x0+HW-4]){ctx.beginPath();ctx.arc(sx,yy,1.2,0,Math.PI*2);ctx.fill()}
  }
  ctx.fillStyle='#000a';ctx.fillRect(-1,OT,2,BOT-OT);
  // padlock
  ctx.strokeStyle='#d9d2c0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-6,4,Math.PI,0);ctx.stroke();
  ctx.fillStyle=st.trim;ctx.strokeStyle=INK;ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(-5.5,-6,11,9,2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,-2.5,1.6,0,Math.PI*2);ctx.fill();ctx.fillRect(-.7,-2.5,1.4,3.5);
  ctx.globalAlpha=.15+.25*pulse;ctx.fillStyle='#fff';ctx.fillRect(-4,-5,2,2);ctx.globalAlpha=1;
 }
 // iron portcullis while enemies are alive (slides down to close, up to open)
 const g0=locked?0:1-t;
 if(g0>.01){
  const gh=(BOT-OT)*g0;
  ctx.fillStyle=st.bar;ctx.strokeStyle=INK;ctx.lineWidth=1;
  for(let i=0;i<6;i++){
   const x=-25+i*10;
   ctx.beginPath();ctx.moveTo(x-2,OT);ctx.lineTo(x-2,OT+Math.max(0,gh-4));ctx.lineTo(x,OT+gh+1);ctx.lineTo(x+2,OT+Math.max(0,gh-4));ctx.lineTo(x+2,OT);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.fillStyle=doorShade(st.bar,.4);ctx.fillRect(x-1.2,OT,1,Math.max(0,gh-3));ctx.fillStyle=st.bar;
  }
  for(const yy of [OT+7,OT+17])if(gh>yy-OT+3){
   ctx.fillStyle=st.bar;ctx.fillRect(-HW,yy,HW*2,3);ctx.strokeRect(-HW,yy,HW*2,3);
   ctx.fillStyle=doorShade(st.bar,.45);ctx.fillRect(-HW,yy,HW*2,1);
  }
 }
 ctx.restore();
 // trim around the opening
 openPath();ctx.strokeStyle=trimC;ctx.lineWidth=2;ctx.stroke();
 // worn threshold and the shadow it throws into the room
 ctx.fillStyle=doorShade(frameC,-.2);ctx.fillRect(-HW-3,BOT-3,HW*2+6,4);
 const sg=ctx.createLinearGradient(0,BOT,0,BOT+12);sg.addColorStop(0,'#000000'+(t>.5?'66':'88'));sg.addColorStop(1,'#00000000');
 ctx.fillStyle=sg;ctx.fillRect(-HW-3,BOT+1,HW*2+6,12);

 // ---- emblems in FRONT of the frame ----
 if(kind==='normal'){
  ctx.fillStyle=trimC;ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,TOP+3);ctx.lineTo(3.5,TOP+7);ctx.lineTo(0,TOP+11);ctx.lineTo(-3.5,TOP+7);ctx.closePath();ctx.fill();ctx.stroke();
 }
 if(kind==='treasure'){

  makeStick(zr,sr,(dx,dy,len)=>{if(len>8){const a=Math.atan2(dy,dx);aim.x=Math.cos(a);aim.y=Math.sin(a);aim.angle=a;if(player){mouse.x=player.x+aim.x*300;mouse.y=player.y+aim.y*300;player.face=a}dirEl.style.transform=`rotate(${a}rad)`;dirEl.style.opacity=1}else dirEl.style.opacity=.35},e=>{fireId=e.pointerId;touchFirePointers.add(fireId);buzz(8)},()=>{if(fireId!==null)touchFirePointers.delete(fireId);fireId=null});
  // Action buttons
  const tap=(id,fn)=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');buzz(12);if(state==='play'||id==='pauseBtn')fn()});const up=()=>b.classList.remove('down');b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)};
  tap('useBtn',()=>{if(player){if(activeConsumable==='card')useCard();else if(activeConsumable==='pill')usePill();else useRune()}});
  tap('bombBtn',()=>{if(player)useBomb()});
  tap('d6Btn',()=>{if(player)useD6()});
  tap('mapBtn',()=>{mapOpen=!mapOpen});
  tap('pauseBtn',()=>{if(state==='play')showPause();else if(state==='pause'){state='play';overlay.classList.add('hidden')}});
  // Keep context-sensitive labels fresh (bomb count, D6 only when owned, current consumable).
  setInterval(()=>{const d6=document.getElementById('d6Btn'),bn=document.getElementById('bombN'),ub=document.getElementById('useBtn').firstElementChild;if(!player)return;d6.style.display=player.d6?'':'none';bn.textContent=player.bombs|0;document.getElementById('bombBtn').classList.toggle('empty',!(player.bombs>0));ub.textContent=(activeConsumable||'use').toUpperCase().slice(0,4)},250);
})();
document.addEventListener('contextmenu',e=>{if(e.target.closest('#mobileControls')||e.target===canvas)e.preventDefault()});
document.body.classList.toggle('mobile-disabled',!settings.mobileOn);setDisplayMode(settings.displayMode);setPixelated(settings.pixelated!==false);showMenu();requestAnimationFrame(loop);
window.addEventListener('error',e=>{overlay.classList.remove('hidden');let msg=String(e.message||'Unknown error'),where=(e.filename?e.filename.split('/').pop():'')+(e.lineno?':'+e.lineno:'');menu.innerHTML='<div class="logo" style="font-size:34px">TEARBOUND ERROR</div><p class="muted">The game hit an error. Reload the page. If it happens again, send these details.</p><p class="muted" style="overflow-wrap:anywhere">'+(msg+' '+where).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});window.addEventListener('unhandledrejection',e=>{overlay.classList.remove('hidden');menu.innerHTML='<div class="logo">TEARBOUND ERROR</div><p class="muted">'+String(e.reason&&e.reason.message||e.reason||'Unexpected async error').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});
})();
</script></body></html>
