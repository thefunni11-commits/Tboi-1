function normalizeItemName(n){return String(n||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function checkSynergies(){if(!player)return;player.synergies=player.synergies||[];const owned=new Set(player.items.map(normalizeItemName));for(const recipe of synergyRecipes){const key=recipe.name;if(!player.synergies.includes(key)&&recipe.needs.every(n=>owned.has(normalizeItemName(n)))){recipe.apply(player);player.synergies.push(key);say('✦ SYNERGY: '+key);sound(740,.24,'triangle',.055)}}}
function applyItem(item){let lost=player.character===6,healthState=lost?{hp:player.hp,maxHp:player.maxHp,soulHp:player.soulHp,blackHearts:player.blackHearts}:null;item[2](player);player.items.push(item[0]);runStats.items++;if(lost){player.hp=healthState.hp;player.maxHp=healthState.maxHp;player.soulHp=healthState.soulHp;player.blackHearts=healthState.blackHearts}say((item[3]===3?'✦ LEGENDARY · ':item[3]===2?'RARE · ':item[3]===1?'UNCOMMON · ':'')+'Picked up '+item[0]);showPickupNotice(item[0],item[1],'ITEM');checkSynergies();if(lost){player.hp=healthState.hp;player.maxHp=healthState.maxHp;player.soulHp=healthState.soulHp;player.blackHearts=healthState.blackHearts}sound(520,.18,'sine')}

function withLostHealthLocked(fn){let lost=player&&player.character===6,hs=lost?{hp:player.hp,maxHp:player.maxHp,soulHp:player.soulHp,blackHearts:player.blackHearts}:null;fn();if(lost){player.hp=hs.hp;player.maxHp=hs.maxHp;player.soulHp=hs.soulHp;player.blackHearts=hs.blackHearts}}
function grantPill(double=false){let a=choice(pillPool);say((double?'HORSE PILL: ':'PILL: ')+a[0]);withLostHealthLocked(()=>{a[2](player);if(double)a[2](player)});if(double)say('HORSE PILL: '+a[0]+' x2')}
function useTaintedWisp(){if(!player||player.character!==18||player.familiars<=0)return;player.familiars--;for(let i=0;i<10;i++){let a=i*Math.PI/5;foeShots.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*5,vy:Math.sin(a)*5,r:6,damage:player.damage*1.2,life:55,friendly:true})}say('WISP SACRIFICE!');sound(520,.16,'triangle') }
function useCard(){if(!player.card){say('No card to use!');return}let c=player.card;player.card=null;say(c[0]);withLostHealthLocked(()=>c[2](player));sound(520,.12,'triangle')}
function usePill(){if(!player.pill){say('No pill to use!');return}let horse=player.pill.horse;player.pill=null;grantPill(horse);sound(360,.1,'sine')}
function useRune(){if(!player||!player.rune){say('No rune to use!');return}let r=player.rune;player.rune=null;if(Array.isArray(r)&&typeof r[2]==='function')withLostHealthLocked(()=>r[2](player));else say('The rune fades.');sound(620,.12,'triangle')}
function useD6(){if(!player||!player.d6){say('No D6 to use!');return}if(player.d6Charge<player.d6Max){say('D6 needs '+(player.d6Max-player.d6Charge)+' more room clears!');return}let pedestals=pickups.filter(p=>['item','shopitem','dealitem'].includes(p.type)&&p.item);if(!pedestals.length){say('No items here to reroll!');return}for(const p of pedestals){let next=randomItem(),tries=0;while(next[0]===p.item[0]&&tries++<8)next=randomItem();p.item=next;p.spin=0;p.spawnAge=0;for(let i=0;i<10;i++)particles.push({x:p.x,y:p.y,vx:rand(-2.5,2.5),vy:rand(-2.5,2.5),life:22,r:rand(2,4),color:'#a8d7ff'})}player.d6Charge=0;say('THE D6! Items rerolled.');sound(680,.22,'triangle',.07)}
function useBomb(){if(player.bombs<=0&&player.goldenBombs<=0){say('No bombs!');return}if(player.goldenBombs>0)player.goldenBombs--;else player.bombs--;pickups.push({x:player.x+Math.cos(aim.angle)*34,y:player.y+Math.sin(aim.angle)*34,type:'placedbomb',fuse:75,golden:player.goldenBombs>=0});sound(180,.12,'square')}
function dropReward(x,y,type){pickups.push({x:x+rand(-28,28),y:y+rand(-24,24),type, value:type==='nickel'?5:type==='dime'?10:type==='coin'?1:undefined,spin:0});}
function openChest(p){
  if(p.type==='chest'||p.type==='goldchest'){
    if(player.goldenKeys>0)player.goldenKeys--;else if(player.keys>0)player.keys--;else{say('A key is needed!');return}
  }else if(p.type==='stonechest'){
    if(player.bombs>0)player.bombs--;else if(player.goldenBombs>0)player.goldenBombs--;else{say('A bomb is needed!');return}
  }
  p.gone=true;let n=p.type==='goldchest'?3:p.type==='stonechest'?2:2;
  for(let i=0;i<n;i++){
    let roll=Math.random(),t=roll<.25?'coin':roll<.40?'heart':roll<.53?'key':roll<.64?'bomb':roll<.75?'soulheart':roll<.84?'nickel':roll<.91?'card':roll<.96?'rune':'trinket';
    dropReward(p.x,p.y,t);
  }
  if(p.type==='goldchest')say('Golden chest opened!');else if(p.type==='stonechest')say('Stone chest cracked!');else say('Chest opened!');sound(620,.16,'triangle');
}
function pickup(p){
 if(player.character===14&&['coin','goldcoin','nickel','dime','heart','soulheart','key','bomb','battery','sack'].includes(p.type)&&Math.random()<.24){let bump=choice(['damage','speed','tears']);if(bump==='damage')player.damage+=.12;else if(bump==='speed')player.speed+=.035;else player.fireRate=Math.max(7,player.fireRate-.35);say('TAINTED CAIN: PICKUP MUTATION!')}
 if(['item','shopitem','dealitem'].includes(p.type)){if(p.type==='shopitem'&&player.coins<(p.price||5)){say('Need '+(p.price||5)+' coins!');return}if(p.type==='shopitem')player.coins-=(p.price||5);if(p.type==='dealitem'&&player.hp<2){say('Not enough hearts to trade!');return}if(p.type==='dealitem')player.hp=Math.max(1,player.hp-1);applyItem(p.item);p.gone=true}
 else if(['chest','goldchest','stonechest'].includes(p.type)){openChest(p)}
 else if(p.type==='coin'||p.type==='nickel'||p.type==='dime'||p.type==='goldcoin'){let value=p.type==='nickel'?5:p.type==='dime'?10:p.type==='goldcoin'?5:(p.value||1);player.coins+=value;p.gone=true;say('+'+value+' coins');sound(700,.07,'square')}
 else if(p.type==='heart'){if(player.character===6){say('The Lost cannot take health!')}else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true;say('Red heart')}else say('Already at full health!')}
 else if(p.type==='doubleheart'){if(player.character===6){say('The Lost cannot take health!')}else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+2);p.gone=true;say('Double heart!')}else say('Already at full health!')}
 else if(p.type==='soulheart'||p.type==='blackheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.soulHp=(player.soulHp||0)+2;if(p.type==='blackheart')player.blackHearts=(player.blackHearts||0)+2;p.gone=true;say(p.type==='blackheart'?'Black heart!':'Soul heart!')}}
 else if(p.type==='eternalheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.maxHp++;player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true;say('Eternal heart!')}}
 else if(p.type==='bomb'){player.bombs++;p.gone=true;say('+1 bomb')}
 else if(p.type==='goldbomb'){player.goldenBombs++;player.bombs++;p.gone=true;say('Golden bomb!')}
 else if(p.type==='key'){player.keys++;p.gone=true;say('+1 key')}
 else if(p.type==='goldkey'){player.goldenKeys++;player.keys++;p.gone=true;say('Golden key!')}
 else if(p.type==='battery'){player.charge=Math.min(34,(player.charge||0)+17);player.invuln=Math.max(player.invuln,25);p.gone=true;say('Battery charge!')}
 else if(p.type==='sack'){if(player.character===14){player.damage+=.25;player.speed+=.08;}p.gone=true;for(let i=0;i<2;i++)dropReward(p.x,p.y,choice(['coin','heart','key','bomb','card','soulheart']));say('A sack of goodies!')}
 else if(p.type==='pill'||p.type==='horse'){if(player.pill){say('Pill slot full!');return}player.pill={horse:p.type==='horse'};p.gone=true;say(p.type==='horse'?'Horse pill':'Pill');showPickupNotice(p.type==='horse'?'Horse Pill':'Pill','Use it to reveal its effect.','PILL')}
 else if(p.type==='card'){if(player.card){say('Card slot full!');return}player.card=p.c||choice(cardPool);p.gone=true;say('Card: '+player.card[0]);showPickupNotice(player.card[0],player.card[1],'CARD')}
 else if(p.type==='trinket'){const t=p.t||(p.t=choice(trinketPool));if(player.trinket){const old=player.trinket;unequipTrinket();pickups.push({x:clamp(player.x+rand(-30,30),ROOM.x+24,ROOM.x+ROOM.w-24),y:clamp(player.y+rand(34,46),ROOM.y+24,ROOM.y+ROOM.h-24),type:'trinket',t:old,spin:0,spawnAge:0,delay:70})}equipTrinket(t);p.gone=true;say('Trinket: '+t[0]);showPickupNotice(t[0],t[1],'TRINKET')}
 else if(p.type==='rune'){if(player.rune){say('Rune slot full!');return}const r=p.r||choice(runePool);player.rune=r;if(!player.card&&!player.pill)activeConsumable='rune';p.gone=true;say('Rune: '+r[0]);showPickupNotice(r[0],r[1],'RUNE')}
}

function makeTear(ang,lane,lanes,mul){return {x:player.x+Math.cos(ang)*17,y:player.y+Math.sin(ang)*17,vx:Math.cos(ang)*player.shotSpeed,vy:Math.sin(ang)*player.shotSpeed,r:player.bulletSize,damage:(player.damage+(player.coinPower?player.coins*.025:0)+(player.character===15?player.shadowPower*.12:0))*mul,life:90,pierce:!!player.piercing,hit:[],homing:!!player.homing,lane,lanes,poison:!!player.poison,slow:!!player.slow,burn:!!(player.burn||player.flame),acid:!!player.acid,explosive:!!player.explosive,knockback:!!player.knockback,flame:!!player.flame,holy:!!player.holy,crit:!!player.crit,bounce:player.bounce?1:0,burst:!!player.burst,chain:!!player.chain}}
function fire(){
 const beamMode=player.character===4||player.brimstone||player.character===16;
 if(beamMode){if(player.beam)return;player.charge=(player.charge||0)+1;if(player.charge>=(player.character===16?18:34)&&!player.beam&&(player.cool||0)<=0){let a=aim.angle;player.face=a;player.beam={angle:a,life:19,tick:0,pierce:true,homing:player.homing,damage:player.damage,poison:!!player.poison,burn:!!(player.burn||player.flame),slow:!!player.slow,acid:!!player.acid,flame:!!player.flame,explosive:!!player.explosive};player.cool=48;player.charge=0;sound(95,.28,'sawtooth',.055);for(let i=0;i<12;i++)particles.push({x:player.x+Math.cos(a)*rand(18,75),y:player.y+Math.sin(a)*rand(18,75),vx:rand(-1,1),vy:rand(-1,1),life:rand(8,18),r:rand(2,6),color:'#d8b4ff'})}return}
 if(player.cool>0)return;player.cool=player.fireRate;let a=aim.angle;player.face=a;let count=Math.min(7,Math.max(1,player.multiShot||1))*(player.doubleShot?2:1);

// ---------------------------------------------------------------------------
// Isaac-style doorways.
// Every door is drawn once in "top wall" space and rotated into place, so all four
// sides share the same art. Design language:
//   - stone frame set into the wall, tinted by the floor theme
//   - a themed emblem on top (crown, coin sign, skull, demon, wings, curse eye)
//   - dark open passage that glows in the room's colour
//   - iron portcullis that drops while enemies are alive
//   - padlocked leaves on a treasure room that has not been unlocked yet
// ---------------------------------------------------------------------------
const DOOR_STYLES={
 normal:{frame:'#7a5144',trim:'#4a3226',leaf:'#5b4332',band:'#2b2127',stud:'#b99a74',bar:'#6f6670',glow:null},
 treasure:{frame:'#a97a2a',trim:'#f1d17a',leaf:'#6b4a1f',band:'#e3bd5a',stud:'#fff0a8',bar:'#d9b45a',glow:'#ffd86b'},
 shop:{frame:'#7d5230',trim:'#c8742c',leaf:'#5e3b20',band:'#d49a54',stud:'#ffd89a',bar:'#c58a4a',glow:'#ffb35c'},
 boss:{frame:'#352b32',trim:'#65505d',leaf:'#34181f',band:'#a24d5b',stud:'#e0a0a6',bar:'#8b4a55',glow:'#ff5a5a'},
 deal:{frame:'#1d0e15',trim:'#ed4a63',leaf:'#150a10',band:'#7a1830',stud:'#ff4a5e',bar:'#8a1c36',glow:'#ff2e4a'},
 angel:{frame:'#e6e0cf',trim:'#f0cf75',leaf:'#f4efe2',band:'#e8c871',stud:'#fff8d8',bar:'#f0e6c0',glow:'#fff3b0'},
 curse:{frame:'#2a2037',trim:'#b69be8',leaf:'#1a1424',band:'#5c4a80',stud:'#b69be8',bar:'#6a5a8c',glow:'#a47dff'}
};
function doorShade(hex,amt){
 let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
 const n=parseInt(h.slice(0,6),16),r=n>>16,g=(n>>8)&255,b=n&255;
 const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);
 return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
// Which design a room uses. A deal room with .angel or .holy set becomes an angel door.
function doorKindOf(room){
 if(!room)return null;
 if(room.type==='deal'&&(room.angel||room.holy))return 'angel';
 return room.type!=='normal'&&DOOR_STYLES[room.type]?room.type:null;
}
function drawDoorway(d,r,f){
 const target=rooms[roomKey(current.x+d.dx,current.y+d.dy)];
 // Both sides of a connection share the special room's frame, like in Isaac.
 const kind=doorKindOf(target)||doorKindOf(r)||'normal',st=DOOR_STYLES[kind];
 const locked=!!(target&&target.type==='treasure'&&!target.unlocked);
 const want=(r.cleared&&!locked)?1:0;
 if(!r.doorT)r.doorT={};
 if(r.doorT[d.side]===undefined)r.doorT[d.side]=locked?0:1;
 let t=r.doorT[d.side];t+=(want-t)*.16;if(Math.abs(want-t)<.004)t=want;r.doorT[d.side]=t;
 const pulse=.5+.5*Math.sin(frame*.07+d.dx*2+d.dy*3);
 const frameC=st.frame||doorShade(f.wall,.34),trimC=st.trim||f.accent;
 const rot={top:0,bottom:Math.PI,left:-Math.PI/2,right:Math.PI/2}[d.side];
 const cx=d.side==='left'?ROOM.x:d.side==='right'?ROOM.x+ROOM.w:480;
 const cy=d.side==='top'?ROOM.y:d.side==='bottom'?ROOM.y+ROOM.h:300;
 const HW=30,FW=44,TOP=-24,BOT=8,OT=-19,INK='#0a070c',DK=1.4; // DK: whole door is drawn 1.4x so it fills the wall depth
 const openPath=()=>{ctx.beginPath();ctx.roundRect(-HW,OT,HW*2,BOT-OT,[8,8,0,0])};
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(DK,DK);ctx.lineJoin='round';

 // ---- emblem pieces that sit BEHIND the frame ----
 if(kind==='angel'){
  const tones=['#fffaf0','#f1ead8','#e2d8bd'],angs=[-.75,-.45,-.15],lens=[26,31,36];
  for(const s of [-1,1])for(let i=0;i<3;i++){
   ctx.save();ctx.translate(s*8,TOP-3);ctx.scale(s,1);ctx.rotate(angs[i]);
   ctx.fillStyle=tones[i];ctx.strokeStyle='#8c8566';ctx.lineWidth=1.2;
   ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(lens[i]*.5,-9,lens[i],-3);ctx.quadraticCurveTo(lens[i]*.55,4,0,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  }
 }
 if(kind==='deal'){ // horns
  const hornC=kind==='deal'?'#5a1020':'#cdbf9f';
  for(const s of [-1,1]){
   ctx.fillStyle=hornC;ctx.strokeStyle=INK;ctx.lineWidth=1.6;
   ctx.beginPath();ctx.moveTo(s*5,TOP-2);ctx.quadraticCurveTo(s*19,TOP-4,s*(kind==='deal'?22:19),TOP-(kind==='deal'?26:21));
   ctx.quadraticCurveTo(s*12,TOP-11,s*4,TOP-10);ctx.closePath();ctx.fill();ctx.stroke();
  }
 }
 if(kind==='curse'){ // thorns
  for(let i=-4;i<=4;i++){
   if(Math.abs(i)<2)continue;
   const x=i*9.5,h=9+(i%2?3:0);
   ctx.fillStyle='#3a2b52';ctx.strokeStyle=INK;ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(x-4,TOP+3);ctx.quadraticCurveTo(x-1,TOP-h*.5,x+Math.sign(i)*3,TOP-h);ctx.quadraticCurveTo(x+3,TOP-h*.3,x+4,TOP+3);ctx.closePath();ctx.fill();ctx.stroke();
  }
 }

 // ---- stone frame ----
 if(kind!=='shop'&&kind!=='normal'&&kind!=='boss'){ctx.fillStyle='#0006';ctx.beginPath();ctx.roundRect(-FW-3,TOP-2,FW*2+6,BOT-TOP+8,[13,13,4,4]);ctx.fill();}
 if(kind==='shop'||kind==='normal'){
  // ---- SHOP / NORMAL: tapered wooden door body (pixel-art style) ----
  const N=kind==='normal';
  const SINK=N?'#2a1810':'#241109',W1=N?'#9a6650':'#8c5a32',W2=N?'#7a5144':'#6b4223',W3=N?'#54372f':'#4a2a14',W4=N?'#3a2620':'#33190c';
  const bt=TOP+3,bb=BOT+3,tw=FW-1,bw=HW+3;
  ctx.fillStyle=W1;ctx.strokeStyle=SINK;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-tw,bt);ctx.lineTo(tw,bt);ctx.lineTo(bw,bb);ctx.lineTo(-bw,bb);ctx.closePath();ctx.fill();ctx.stroke();
  // darker recess under the lintel
  ctx.fillStyle=W3;ctx.fillRect(-tw+3,bt+1,(tw-3)*2,6);
  // shaded outer edges and plank seams
  ctx.fillStyle=W2;
  for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*(tw-1),bt+7);ctx.lineTo(s*(tw-7),bt+7);ctx.lineTo(s*(bw-4),bb-1);ctx.lineTo(s*(bw-1),bb-1);ctx.closePath();ctx.fill()}
  ctx.strokeStyle=W3;ctx.lineWidth=1;ctx.beginPath();
  for(const x of [-34,-26,26,34]){ctx.moveTo(x*(1-.0),bt+8);ctx.lineTo(x*.9,bb-2)}
  ctx.stroke();
  // base plank
  ctx.fillStyle=W2;ctx.strokeStyle=SINK;ctx.lineWidth=1.6;ctx.beginPath();ctx.rect(-bw+1,bb-1,(bw-1)*2,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=N?'#b8785c':'#a8683a';ctx.fillRect(-bw+2,bb,(bw-2)*2,1);
 }else if(kind==='boss'){
  // ---- BOSS: armoured stone frame with stacked rib plates down both sides ----
  const SINK='#191912',S1='#4e3f49',S2='#65505d',S3='#352b32',S4='#231c20';
  ctx.fillStyle=S1;ctx.strokeStyle=SINK;ctx.lineWidth=2.2;
  ctx.beginPath();ctx.roundRect(-FW,TOP,FW*2,BOT-TOP,[9,9,3,3]);ctx.fill();ctx.stroke();
  ctx.fillStyle=S3;ctx.fillRect(-FW+2,TOP+2,(FW-2)*2,OT-TOP-1);
  for(const s of [-1,1])for(let i=0;i<4;i++){
   const y=OT+i*6.6+1,x0=s<0?-FW+1.5:HW+.5,w=FW-HW-2;
   ctx.fillStyle=S1;ctx.strokeStyle=SINK;ctx.lineWidth=1.1;
   ctx.beginPath();ctx.roundRect(x0,y,w,5.6,2);ctx.fill();ctx.stroke();
   ctx.fillStyle=S2;ctx.fillRect(x0+1.5,y+.8,w-3,1.1);
   ctx.fillStyle=S4;ctx.fillRect(x0+1.5,y+4,w-3,1);
  }
 }else{
 ctx.fillStyle=frameC;ctx.strokeStyle=INK;ctx.lineWidth=3;
 ctx.beginPath();ctx.roundRect(-FW,TOP,FW*2,BOT-TOP,[11,11,3,3]);ctx.fill();ctx.stroke();
 ctx.strokeStyle=doorShade(frameC,.35);ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-FW+3,BOT-3);ctx.lineTo(-FW+3,TOP+10);ctx.quadraticCurveTo(-FW+3,TOP+3,-FW+11,TOP+3);ctx.lineTo(FW-11,TOP+3);ctx.stroke();
 ctx.strokeStyle=doorShade(frameC,-.45);ctx.lineWidth=1.4;ctx.beginPath();
 for(const s of [-1,1])for(let i=0;i<3;i++){
  const y=TOP+8+i*8,vx=s*(HW+5+(i%2)*4);
  ctx.moveTo(s*(HW+1),y);ctx.lineTo(s*(FW-2),y);ctx.moveTo(vx,y);ctx.lineTo(vx,y+8);
 }
 ctx.stroke();
 // keystone
 ctx.fillStyle=doorShade(frameC,.18);ctx.strokeStyle=INK;ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(-6,TOP+1);ctx.lineTo(6,TOP+1);ctx.lineTo(4.5,OT-1);ctx.lineTo(-4.5,OT-1);ctx.closePath();ctx.fill();ctx.stroke();
 }

 // ---- passage ----
 openPath();ctx.save();ctx.clip();
 let g=ctx.createLinearGradient(0,OT,0,BOT);g.addColorStop(0,'#030206');g.addColorStop(1,'#140e18');
 ctx.fillStyle=g;ctx.fillRect(-HW,OT,HW*2,BOT-OT);
 if(st.glow&&t>.02){
  ctx.globalAlpha=Math.min(1,(.24+.2*pulse)*t*(kind==='angel'?1.9:1));
  const gg=ctx.createLinearGradient(0,OT,0,BOT);gg.addColorStop(0,st.glow+'00');gg.addColorStop(1,st.glow);

 }
 if(kind==='deal'&&t>.05){ // inverted pentagram floating in the dark
  ctx.globalAlpha=(.35+.35*pulse)*t;ctx.strokeStyle='#ff3350';ctx.lineWidth=1.1;

 }
 if(kind==='angel'&&t>.05){ // light rays and rising motes

   ctx.fillStyle=st.stud;
   for(const yy of [OT+6.5,BOT-7.5])for(const sx of [x0+4,x0+HW-4]){ctx.beginPath();ctx.arc(sx,yy,1.2,0,Math.PI*2);ctx.fill()}

  ctx.fillStyle=st.trim;ctx.strokeStyle=INK;ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(-5.5,-6,11,9,2);ctx.fill();ctx.stroke();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,-2.5,1.6,0,Math.PI*2);ctx.fill();ctx.fillRect(-.7,-2.5,1.4,3.5);

   ctx.beginPath();ctx.moveTo(x-2,OT);ctx.lineTo(x-2,OT+Math.max(0,gh-4));ctx.lineTo(x,OT+gh+1);ctx.lineTo(x+2,OT+Math.max(0,gh-4));ctx.lineTo(x+2,OT);ctx.closePath();ctx.fill();ctx.stroke();

 if(kind==='shop'){

   for(const sd of [-1,1]){

 else if(mv==='drift'){const tx=480+Math.cos(t*.011)*210,ty=190+Math.sin(t*.015)*95;e.x+=(tx-e.x)*.012*dt*sp+Math.cos(t*.03)*.15;e.y+=(ty-e.y)*.012*dt*sp}

function bossTick(e,a,d,dx,dy,sf,dt){

 if(e.intro>0){e.intro-=dt;e.invul=e.intro>0;return}
 if(!e.ph2&&e.hp<e.max*.5){e.ph2=true;e.wait=34;e.tel=0;shake=Math.max(shake,8);say(e.name+' is enraged!');sound(60,.3,'sawtooth');
  const extra=['ring','fan','bombs','bounce','curtain'].filter(k=>!e.kit.some(q=>q.split(':')[0]===k));if(extra.length)e.kit=[...e.kit,extra[e.v%extra.length]]}

 if(e.def.body==='worm'&&(e.bt%3<dt)){e.trail.push({x:e.x,y:e.y});if(e.trail.length>16)e.trail.shift()}

   const m=k.split(':');e.last=m[0];e.pend=m;e.tel=BA[m[0]].tel;e.telK=m[0]}}
}

    if(f.emerge){const e=f.emerge;if(e.hp>0){e.x=f.x;e.y=f.y;e.hide=0;e.invul=false;bossBoom(f.x,f.y,f.r,f.col);bossShock(f.x,f.y,160,2.6,f.col);

     else if(f.edge===1)foeShots.push({x:p,y:ROOM.y+ROOM.h-10,vx:0,vy:-f.sp,r:7,life:300,col:f.col});

    sound(170,.1,'square')}}
  else if(f.k==='boom'){f.t-=dt;if(f.t<=0)f.dead=true}
 }
 bossFX=bossFX.filter(f=>!f.dead);
 for(const s of foeShots){if(!(s.bounce>0))continue;const nx=s.x+s.vx*dt,ny=s.y+s.vy*dt;

// ---- equipping / dropping ----
const fxSnap=o=>{const s={};for(const k in o){const v=o[k];if(typeof v==='number'||typeof v==='boolean')s[k]=v}return s};
function equipTrinket(t){const before=fxSnap(player);withLostHealthLocked(()=>t[2](player));const after=fxSnap(player),d={};
 for(const k in after){if(!(k in before))d[k]=['new',after[k]];else if(after[k]!==before[k])d[k]=typeof after[k]==='number'?['n',after[k]-before[k]]:['b',before[k]]}
 player.trinket=t;player.trinketFx=d}
function unequipTrinket(){const d=player.trinketFx||{};
 for(const k in d){const[tp_,v]=d[k];if(tp_==='n')player[k]-=v;else if(tp_==='b')player[k]=v;else if(typeof v==='number')player[k]=(player[k]||0)-v;else player[k]=false}
 player.trinket=null;player.trinketFx=null;player.hp=Math.min(player.hp,player.maxHp)}
function dropSpot(i,n){const ang=aim.angle+Math.PI+(i-(n-1)/2)*.8;return{x:clamp(player.x+Math.cos(ang)*48,ROOM.x+24,ROOM.x+ROOM.w-24),y:clamp(player.y+Math.sin(ang)*48,ROOM.y+24,ROOM.y+ROOM.h-24)}}
function dropAll(){const list=[];if(player.trinket)list.push('trinket');if(player.card)list.push('card');if(player.pill)list.push('pill');if(player.rune)list.push('rune');
 if(!list.length){say('Nothing to drop.');return false}
 list.forEach((k,i)=>{const s=dropSpot(i,list.length),b={x:s.x,y:s.y,spin:0,spawnAge:0,delay:55};
  if(k==='trinket'){const t=player.trinket;unequipTrinket();pickups.push({...b,type:'trinket',t})}
  else if(k==='card'){pickups.push({...b,type:'card',c:player.card});player.card=null}
  else if(k==='pill'){pickups.push({...b,type:player.pill.horse?'horse':'pill'});player.pill=null}
  else{pickups.push({...b,type:'rune',r:player.rune});player.rune=null}
  for(let q=0;q<6;q++)particles.push({x:s.x,y:s.y,vx:rand(-1.5,1.5),vy:rand(-1.5,1.5),life:14,r:2,color:'#e8d8a8'})});
 say('Dropped '+list.length+(list.length>1?' items.':' item.'));sound(300,.08,'triangle');return true}
function tickDrop(){if(!player||state!=='play'){return}
 if(controlHeld&&!controlDropped&&performance.now()-controlDownAt>=DROP_HOLD){controlDropped=true;dropAll()}}
function useActiveSlot(){if(!player)return;if(!player[activeConsumable]){const f=['card','pill','rune'].find(k=>player[k]);if(f)activeConsumable=f}
 if(activeConsumable==='card')useCard();else if(activeConsumable==='pill')usePill();else useRune()}

 if(!best||bd>120)return; // only the closest one gets a label, so crowded drops stay readable
 for(const p of [best]){
  const d=bd;const it=pickupItemOf(p),a=Math.min(1,(120-d)/45);
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';

  ctx.fillStyle=ctx.strokeStyle;ctx.font='bold 8px system-ui';ctx.fillText(kind,x,y-h+11);

function updateGas(dt){
 for(const c of gasClouds){
  c.age+=dt;c.x=clamp(c.x+c.vx*dt,ROOM.x+10,ROOM.x+ROOM.w-10);c.y=clamp(c.y+c.vy*dt,ROOM.y+10,ROOM.y+ROOM.h-10);
  c.vx*=Math.pow(.955,dt);c.vy*=Math.pow(.955,dt);
  const k=Math.min(1,c.age/18);c.r=c.max*(1-Math.pow(1-k,2));
  if(!player||c.age>=c.life)continue;
  const dx=player.x-c.x,dy=player.y-c.y,dd=Math.hypot(dx,dy)||1,pr=player.r||13,reach=c.r+pr*.5;
  if(dd<reach){
   const fade=c.age>c.life-24?(c.life-c.age)/24:1,push=(1.2+2.4*(1-dd/reach))*fade*dt;
   const nx=clamp(player.x+dx/dd*push,ROOM.x+20,ROOM.x+ROOM.w-20),ny=clamp(player.y+dy/dd*push,ROOM.y+20,ROOM.y+ROOM.h-20);
   if(!blockedAt(nx,player.y,pr))player.x=nx;
   if(!blockedAt(player.x,ny,pr))player.y=ny;
  }
 }
 gasClouds=gasClouds.filter(c=>c.age<c.life);
}
function drawGas(){
 for(const c of gasClouds){
  const k=c.age/c.life,fade=k<.1?k/.1:k>.7?(1-k)/.3:1,r=c.r;
  ctx.save();ctx.translate(c.x,c.y);
  for(let i=0;i<9;i++){
   const ang=c.seed+i*2.399+c.age*.025*(i%2?1:-1),rr=r*(.2+.55*(((i*37)%10)/10)),px=Math.cos(ang)*rr,py=Math.sin(ang)*rr*.8,pr=r*(.34+.14*(((i*53)%7)/7));
   const gr=ctx.createRadialGradient(px-pr*.15,py-pr*.2,pr*.1,px,py,pr);gr.addColorStop(0,'rgba(205,226,128,.62)');gr.addColorStop(.55,'rgba(150,176,76,.40)');gr.addColorStop(1,'rgba(130,160,60,0)');
   ctx.globalAlpha=fade;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=.18*fade;ctx.strokeStyle='#e6f1ae';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.lineDashOffset=-c.age*.6;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();

}

function drawEnemy(e){
  ctx.save();
  const isBoss=e.type==='boss',t=frame||0,phase=e.phase||0;
  const hurt=e.hit>0,flash=hurt?'#fff4e8':null;
  const bob=Math.sin(t*.16+(e.x||0)*.03)*(isBoss?2.8:1.8);
  const pulse=.5+.5*Math.sin(t*.12+phase);
  const squash=1+Math.sin(t*.19+phase)*.035+(hurt?.12:0);
  ctx.translate(Math.round(e.x),Math.round(e.y+bob));
  ctx.imageSmoothingEnabled=false;
  // Chunky shadow and a small contact shadow make the creatures feel grounded.
  ctx.fillStyle='#08060a99';ctx.beginPath();ctx.ellipse(1,isBoss?31:13,isBoss?37:14,isBoss?8:4,0,0,Math.PI*2);ctx.fill();
  const body=(fill,rx,ry,stroke='#30202a')=>{ctx.fillStyle=flash||fill;ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.stroke()};
  const eye=(x,y,r=3,col='#fff0d8')=>{ctx.fillStyle=col;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.fillStyle='#211722';ctx.fillRect(x-1,y-1,3,4)};
  const pixelMouth=(w=10)=>{ctx.fillStyle='#26131d';ctx.fillRect(-w/2,7,w,4);ctx.fillStyle='#e9c6b3';for(let x=-w/2+1;x<w/2-1;x+=4)ctx.fillRect(x,7,2,2)};
  if(e.def){NEWBOSSDRAW(e,t,phase,flash)}else if(isBoss){
    const kind=e.bossKind||'ring';
    const attackTell=e.cool<24&&e.cool>0;
    const chargeDash=(e.dashTimer||0)>0;

   shots=[];foeShots=[];enemies=[];pickups=[];particles=[];mapOpen=false;mapRevealed=false;toast='';toastTime=0;shake=0;keys={};mouse.down=false;touchFirePointers.clear();aim={x:1,y:0,angle:0};
   makeFloor();
   say((selectedDifficulty==='hard'?'HARD MODE · ':'NORMAL MODE · ')+floors[floor].name);
   if(!rooms[roomKey(current.x,current.y)]||!player||!Array.isArray(enemies)||!Array.isArray(pickups))throw new Error('The starting room did not initialize correctly');
   state='play';overlay.classList.add('hidden');sound(440,.15);startMusic();
 }catch(err){
   state='menu';if(musicClock){clearInterval(musicClock);musicClock=null}overlay.classList.remove('hidden');
   menu.innerHTML='<div class="logo">TEARBOUND STARTUP ERROR</div><p class="muted">The run could not start. Your character selection is safe. You can retry or return to the menu.</p><pre id="startupDetails" style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;color:#6c5844;font-size:11px"></pre><button class="btn" id="backToSelect">BACK TO CHARACTERS</button>';
   document.getElementById('startupDetails').textContent=(err&&err.stack)||String(err);
   document.getElementById('backToSelect').onclick=showSelect;console.error('Tearbound startRun failed:',err);
 }
}
function saveSettings(){try{localStorage.setItem('tearboundSettings',JSON.stringify(settings))}catch(e){}document.body.classList.toggle('mobile-disabled',!settings.mobileOn);canvas.classList.toggle('canvas-pixelated',settings.pixelated!==false);if(musicClock){clearInterval(musicClock);musicClock=null}if(settings.musicOn&&settings.music>0&&state==='play')startMusic()}
function showPause(){state='pause';overlay.classList.remove('hidden');renderPause()}
function renderPause(){menu.innerHTML=`<div class="logo" style="font-size:42px">PAUSED</div><button class="btn" id="resume">RESUME</button><div class="settings-row"><label for="masterVolume">Master volume</label><input id="masterVolume" type="range" min="0" max="1" step="0.05" value="${settings.volume}"><span class="setting-value" id="masterValue">${Math.round(settings.volume*100)}%</span></div><div class="settings-row"><label for="sfxVolume">Sound effects</label><input id="sfxVolume" type="range" min="0" max="1" step="0.05" value="${settings.sfx}"><span class="setting-value" id="sfxValue">${Math.round(settings.sfx*100)}%</span></div><div class="settings-row"><label for="musicVolume">Music volume</label><input id="musicVolume" type="range" min="0" max="1" step="0.05" value="${settings.music}"><span class="setting-value" id="musicValue">${Math.round(settings.music*100)}%</span></div><div class="settings-row"><label for="musicOn">Music enabled</label><input id="musicOn" type="checkbox" ${settings.musicOn?'checked':''}></div><div class="settings-row"><label for="mobileOn">Mobile controls</label><input id="mobileOn" type="checkbox" ${settings.mobileOn?'checked':''}></div><div class="settings-row"><label for="pixelatedOn">Pixelated graphics</label><input id="pixelatedOn" type="checkbox" ${settings.pixelated?'checked':''}></div>${displayModeButtons()}<button class="btn" id="restart">RESTART RUN</button><button class="btn" id="quit">MAIN MENU</button><p class="muted">Settings are saved on this device.</p>`;
document.getElementById('resume').onclick=()=>{state='play';overlay.classList.add('hidden');if(settings.musicOn&&settings.music>0)startMusic()};document.getElementById('restart').onclick=showSelect;document.getElementById('quit').onclick=showMenu;
const master=document.getElementById('masterVolume'),sfx=document.getElementById('sfxVolume'),mus=document.getElementById('musicVolume');master.oninput=()=>{settings.volume=+master.value;document.getElementById('masterValue').textContent=Math.round(settings.volume*100)+'%';saveSettings()};sfx.oninput=()=>{settings.sfx=+sfx.value;document.getElementById('sfxValue').textContent=Math.round(settings.sfx*100)+'%';saveSettings()};mus.oninput=()=>{settings.music=+mus.value;document.getElementById('musicValue').textContent=Math.round(settings.music*100)+'%';saveSettings()};document.getElementById('musicOn').onchange=e=>{settings.musicOn=e.target.checked;saveSettings()};document.getElementById('mobileOn').onchange=e=>{settings.mobileOn=e.target.checked;saveSettings()};document.getElementById('pixelatedOn').onchange=e=>{setPixelated(e.target.checked);saveSettings()};bindDisplayModeButtons();} 
function showDead(){overlay.classList.remove('hidden');menu.innerHTML=`<div class="logo">RUN ENDED</div><p class="muted">The hollow keeps its secrets. Every descent teaches you something.</p><p>Kills: ${runStats.kills} · Relics: ${runStats.items} · Reached: ${floors[floor].name}</p><button class="btn" id="again">TRY AGAIN</button><button class="btn" id="menuBtn">MAIN MENU</button>`;document.getElementById('again').onclick=showSelect;document.getElementById('menuBtn').onclick=showMenu}
function showWin(){overlay.classList.remove('hidden');menu.innerHTML=`<div class="logo">THE LIGHT RETURNS</div><p class="muted">You crossed every floor and reached the end of the hollow.</p><p>Kills: ${runStats.kills} · Relics: ${runStats.items}</p><button class="btn" id="again">PLAY AGAIN</button><button class="btn" id="menuBtn">MAIN MENU</button>`;document.getElementById('again').onclick=showSelect;document.getElementById('menuBtn').onclick=showMenu}
window.addEventListener('keydown',e=>{if(window.__menuNav)window.__menuNav(e);if(e.key==='Control'&&!controlHeld){controlHeld=true;controlDropped=false;controlDownAt=performance.now();e.preventDefault();return}const k=e.key===' '?'Space':e.key.length===1?e.key.toLowerCase():e.key;if(selectionScreen&&e.key==='Enter'){e.preventDefault();startRun(selected);return}if(selectionScreen&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)){e.preventDefault();if(k==='ArrowLeft')selected=(selected+chars.length-1)%chars.length;else if(k==='ArrowRight')selected=(selected+1)%chars.length;else selectedDifficulty=k==='ArrowUp'?'normal':'hard';renderSelect();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(k))e.preventDefault();keys[k]=true;if(k==='Tab'){mapOpen=!mapOpen}if(k==='Escape'&&state==='play')showPause();if(k==='Space'&&state==='play'){}if(state==='play'&&k==='q'){if(activeConsumable==='card')useCard();else if(activeConsumable==='pill')usePill();else useRune()}if(state==='play'&&k==='e')useBomb();if(state==='play'&&k==='f')useD6()});window.addEventListener('keyup',e=>{if(e.key==='Control'){if(controlHeld){let held=performance.now()-controlDownAt;controlHeld=false;if(controlDropped){controlDropped=false}else{activeConsumable=activeConsumable==='card'?'pill':activeConsumable==='pill'?'rune':'card';say('Active slot: '+activeConsumable.toUpperCase())}}return}const k=e.key===' '?'Space':e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});window.addEventListener('blur',()=>{keys={};mouse.down=false;touchFirePointers.clear()});
function point(e){let b=canvas.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height;if(player){let dx=mouse.x-player.x,dy=mouse.y-player.y,len=Math.hypot(dx,dy)||1;aim.x=dx/len;aim.y=dy/len;aim.angle=Math.atan2(aim.y,aim.x)}}
const touchFirePointers=new Set();canvas.addEventListener('pointermove',point);canvas.addEventListener('pointerdown',e=>{point(e);if(e.pointerType==='touch'){e.preventDefault();touchFirePointers.add(e.pointerId)}else mouse.down=true});function releaseCanvasFire(e){touchFirePointers.delete(e.pointerId);if(e.pointerType!=='touch')mouse.down=false}canvas.addEventListener('pointerup',releaseCanvasFire);canvas.addEventListener('pointercancel',releaseCanvasFire);
// Touchscreen controls: floating move stick (left half) + floating aim-and-fire stick (right half) + action buttons.
(()=>{
  const zl=document.getElementById('zoneL'),zr=document.getElementById('zoneR'),sl=document.getElementById('stickL'),sr=document.getElementById('stickR'),MAXR=54,buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
  const place=(el,x,y)=>{el.style.left=(x-el.offsetWidth/2)+'px';el.style.top=(y-el.offsetHeight/2)+'px';el.classList.add('on')};
  const knob=(el,dx,dy)=>{el.firstElementChild.style.transform=`translate(${dx}px,${dy}px)`};
  function makeStick(zone,el,onMove,onStart,onEnd){
    let id=null,ox=0,oy=0;
    const move=e=>{if(e.pointerId!==id)return;let dx=e.clientX-ox,dy=e.clientY-oy,len=Math.hypot(dx,dy);if(len>MAXR){const k=(len-MAXR)/len;ox+=dx*k;oy+=dy*k;dx=e.clientX-ox;dy=e.clientY-oy;len=MAXR;const kk=MAXR/Math.hypot(dx,dy);dx*=kk;dy*=kk;place(el,ox,oy)}knob(el,dx,dy);onMove(dx,dy,len)};
    const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('on');knob(el,0,0);onEnd()};
    zone.addEventListener('pointerdown',e=>{document.body.classList.add('mc-used');if(id!==null)return;e.preventDefault();id=e.pointerId;try{zone.setPointerCapture(id)}catch(_){}ox=e.clientX;oy=e.clientY;place(el,ox,oy);knob(el,0,0);onStart(e);onMove(0,0,0)});
    zone.addEventListener('pointermove',move);zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);zone.addEventListener('lostpointercapture',end);
  }
  // Movement: 8-way from the stick angle with a small dead zone.
  makeStick(zl,sl,(dx,dy,len)=>{const on=len>10,nx=on?dx/len:0,ny=on?dy/len:0;keys.d=nx>.38;keys.a=nx<-.38;keys.s=ny>.38;keys.w=ny<-.38},()=>{},()=>{keys.w=keys.a=keys.s=keys.d=false});
  // Aim + fire: touching the right half fires; dragging steers the aim; releasing stops.
  let fireId=null;const dirEl=sr.querySelector('.dir');
  makeStick(zr,sr,(dx,dy,len)=>{if(len>8){const a=Math.atan2(dy,dx);aim.x=Math.cos(a);aim.y=Math.sin(a);aim.angle=a;if(player){mouse.x=player.x+aim.x*300;mouse.y=player.y+aim.y*300;player.face=a}dirEl.style.transform=`rotate(${a}rad)`;dirEl.style.opacity=1}else dirEl.style.opacity=.35},e=>{fireId=e.pointerId;touchFirePointers.add(fireId);buzz(8)},()=>{if(fireId!==null)touchFirePointers.delete(fireId);fireId=null});
  // Action buttons
  const tap=(id,fn)=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');buzz(12);if(state==='play'||id==='pauseBtn')fn()});const up=()=>b.classList.remove('down');b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)};
  (()=>{const b=document.getElementById('useBtn');let tm=null,down=false,did=false;
   const stop=()=>{clearTimeout(tm);down=false;dropHoldAt=0;b.classList.remove('down')};
   b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');buzz(12);down=true;did=false;dropHoldAt=performance.now();clearTimeout(tm);
    tm=setTimeout(()=>{if(down&&state==='play'&&player){did=true;dropAll();buzz(30)}dropHoldAt=0},DROP_HOLD)});
   b.addEventListener('pointerup',()=>{const wasDown=down;stop();if(wasDown&&!did&&state==='play'&&player)useActiveSlot()});
   b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)})();
  tap('bombBtn',()=>{if(player)useBomb()});
  tap('d6Btn',()=>{if(player)useD6()});
  tap('mapBtn',()=>{mapOpen=!mapOpen});
  tap('pauseBtn',()=>{if(state==='play')showPause();else if(state==='pause'){state='play';overlay.classList.add('hidden')}});
  // Keep context-sensitive labels fresh (bomb count, D6 only when owned, current consumable).
  setInterval(()=>{const d6=document.getElementById('d6Btn'),bn=document.getElementById('bombN'),ub=document.getElementById('useBtn').firstElementChild;if(!player)return;d6.style.display=player.d6?'':'none';bn.textContent=player.bombs|0;document.getElementById('bombBtn').classList.toggle('empty',!(player.bombs>0));ub.textContent=(activeConsumable||'use').toUpperCase().slice(0,4)},250);
})();
document.addEventListener('contextmenu',e=>{if(e.target.closest('#mobileControls')||e.target===canvas)e.preventDefault()});
document.body.classList.toggle('mobile-disabled',!settings.mobileOn);setDisplayMode(settings.displayMode);setPixelated(settings.pixelated!==false);showMenu();requestAnimationFrame(loop);
window.addEventListener('error',e=>{overlay.classList.remove('hidden');let msg=String(e.message||'Unknown error'),where=(e.filename?e.filename.split('/').pop():'')+(e.lineno?':'+e.lineno:'');menu.innerHTML='<div class="logo" style="font-size:34px">TEARBOUND ERROR</div><p class="muted">The game hit an error. Reload the page. If it happens again, send these details.</p><p class="muted" style="overflow-wrap:anywhere">'+(msg+' '+where).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});window.addEventListener('unhandledrejection',e=>{overlay.classList.remove('hidden');menu.innerHTML='<div class="logo">TEARBOUND ERROR</div><p class="muted">'+String(e.reason&&e.reason.message||e.reason||'Unexpected async error').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});
})();
