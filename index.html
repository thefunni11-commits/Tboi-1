function makeFloor(){
 // Build a connected map using a finite frontier list. This avoids a rare
 // random-walk stall that could leave character startup appearing frozen.

 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

   const frontier=[];
   for(const c of cells)for(const d of dirs){const x=c.x+d[0],y=c.y+d[1],k=roomKey(x,y);if(x>=0&&x<=4&&y>=0&&y<=4&&!have.has(k))frontier.push({x,y,k});}
   if(!frontier.length)break;
   const next=choice(frontier);have.add(next.k);cells.push({x:next.x,y:next.y});
 }
 // Optional connected branches add variety without disconnecting rooms.
 for(let i=0;i<25;i++)if(Math.random()<.42){const from=choice(cells),d=choice(dirs),x=from.x+d[0],y=from.y+d[1],k=roomKey(x,y);if(x>=0&&x<=4&&y>=0&&y<=4&&!have.has(k)){have.add(k);cells.push({x,y});}}
 const start='2,2';
 const bossCandidates=cells.filter(c=>roomKey(c.x,c.y)!==start&&(c.x===0||c.x===4||c.y===0||c.y===4));
 const boss=choice(bossCandidates.length?bossCandidates:cells.filter(c=>roomKey(c.x,c.y)!==start));
 const treasureCandidates=cells.filter(c=>roomKey(c.x,c.y)!==start&&roomKey(c.x,c.y)!==roomKey(boss.x,boss.y));
 // Every floor has exactly one treasure room, with a 5% chance of a second.
 const treasureCount=Math.random()<.05?2:1;
 const treasureRooms=[];while(treasureRooms.length<Math.min(treasureCount,treasureCandidates.length)){
   const pick=choice(treasureCandidates.filter(c=>!treasureRooms.some(t=>t.x===c.x&&t.y===c.y)));
   if(!pick)break;treasureRooms.push(pick);
 }
 const treasureKeys=new Set(treasureRooms.map(c=>roomKey(c.x,c.y)));
 for(const c of cells){
   const k=roomKey(c.x,c.y);let type='normal';
   if(k===roomKey(boss.x,boss.y))type='boss';
   else if(treasureKeys.has(k))type='treasure';

function withLostHealthLocked(fn){let lost=player&&player.character===6,hs=lost?{hp:player.hp,maxHp:player.maxHp,soulHp:player.soulHp,blackHearts:player.blackHearts}:null;fn();if(lost){player.hp=hs.hp;player.maxHp=hs.maxHp;player.soulHp=hs.soulHp;player.blackHearts=hs.blackHearts}}
function grantPill(double=false){let a=choice(pillPool);say((double?'HORSE PILL: ':'PILL: ')+a[0]);withLostHealthLocked(()=>{a[2](player);if(double)a[2](player)});if(double)say('HORSE PILL: '+a[0]+' x2')}
function useCard(){if(!player.card){say('No card to use!');return}let c=player.card;player.card=null;say(c[0]);withLostHealthLocked(()=>c[2](player));sound(520,.12,'triangle')}
function usePill(){if(!player.pill){say('No pill to use!');return}let horse=player.pill.horse;player.pill=null;grantPill(horse);sound(360,.1,'sine')}
function useBomb(){if(player.bombs<=0&&player.goldenBombs<=0){say('No bombs!');return}if(player.goldenBombs>0)player.goldenBombs--;else player.bombs--;pickups.push({x:player.x+Math.cos(aim.angle)*34,y:player.y+Math.sin(aim.angle)*34,type:'placedbomb',fuse:75,golden:player.goldenBombs>=0});sound(180,.12,'square')}
function dropReward(x,y,type){pickups.push({x:x+rand(-28,28),y:y+rand(-24,24),type, value:type==='nickel'?5:type==='dime'?10:type==='coin'?1:undefined,spin:0});}
function openChest(p){
  if(p.type==='chest'||p.type==='goldchest'){
    if(player.goldenKeys>0)player.goldenKeys--;else if(player.keys>0)player.keys--;else{say('A key is needed!');return}
  }else if(p.type==='stonechest'){
    if(player.bombs>0)player.bombs--;else if(player.goldenBombs>0)player.goldenBombs--;else{say('A bomb is needed!');return}
  }
  p.gone=true;let n=p.type==='goldchest'?3:p.type==='stonechest'?2:2;
  for(let i=0;i<n;i++){
    let roll=Math.random(),t=roll<.25?'coin':roll<.40?'heart':roll<.53?'key':roll<.64?'bomb':roll<.75?'soulheart':roll<.84?'nickel':roll<.94?'card':'trinket';
    dropReward(p.x,p.y,t);
  }
  if(p.type==='goldchest')say('Golden chest opened!');else if(p.type==='stonechest')say('Stone chest cracked!');else say('Chest opened!');sound(620,.16,'triangle');
}

 if(['item','shopitem','dealitem'].includes(p.type)){if(p.type==='shopitem'&&player.coins<5){say('Need 5 coins!');return}if(p.type==='shopitem')player.coins-=5;if(p.type==='dealitem'&&player.hp<2){say('Not enough hearts to trade!');return}if(p.type==='dealitem')player.hp=Math.max(1,player.hp-1);applyItem(p.item);p.gone=true}
 else if(['chest','goldchest','stonechest'].includes(p.type)){openChest(p)}

 else if(p.type==='doubleheart'){if(player.character===6){say('The Lost cannot take health!')}else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+2);p.gone=true;say('Double heart!')}else say('Already at full health!')}
 else if(p.type==='soulheart'||p.type==='blackheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.soulHp=(player.soulHp||0)+2;if(p.type==='blackheart')player.blackHearts=(player.blackHearts||0)+2;p.gone=true;say(p.type==='blackheart'?'Black heart!':'Soul heart!')}}
 else if(p.type==='eternalheart'){if(player.character===6){say('The Lost cannot take health!')}else{player.maxHp++;player.hp=Math.min(player.maxHp,player.hp+1);p.gone=true;say('Eternal heart!')}}
 else if(p.type==='bomb'){player.bombs++;p.gone=true;say('+1 bomb')}

 else if(p.type==='pill'||p.type==='horse'){if(player.pill){say('Pill slot full!');return}player.pill={horse:p.type==='horse'};p.gone=true;say(p.type==='horse'?'Horse pill':'Pill');showPickupNotice(p.type==='horse'?'Horse Pill':'Pill','Use it to reveal its effect.','PILL')}
 else if(p.type==='card'){if(player.card){say('Card slot full!');return}player.card=choice(cardPool);p.gone=true;say('Card: '+player.card[0]);showPickupNotice(player.card[0],player.card[1],'CARD')}
 else if(p.type==='trinket'){if(player.trinket){say('Trinket slot full!');return}player.trinket=choice(trinketPool);withLostHealthLocked(()=>player.trinket[2](player));p.gone=true;say('Trinket: '+player.trinket[0]);showPickupNotice(player.trinket[0],player.trinket[1],'TRINKET')}
}

function fire(){if(player.character===4||player.brimstone){if(player.beam)return;player.charge=(player.charge||0)+1;if(player.charge>=34&&!player.beam&&(player.cool||0)<=0){let a=aim.angle;player.face=a;player.beam={angle:a,life:19,tick:0};player.cool=48;player.charge=0;sound(95,.28,'sawtooth',.055);for(let i=0;i<12;i++)particles.push({x:player.x+Math.cos(a)*rand(18,75),y:player.y+Math.sin(a)*rand(18,75),vx:rand(-1,1),vy:rand(-1,1),life:rand(8,18),r:rand(2,6),color:'#d8b4ff'})}return}if(player.cool>0)return;player.cool=player.fireRate;let a=aim.angle;player.face=a;let count=player.multiShot;for(let i=0;i<count;i++){let ang=a+(i-(count-1)/2)*.16;shots.push({x:player.x+Math.cos(ang)*17,y:player.y+Math.sin(ang)*17,vx:Math.cos(ang)*player.shotSpeed,vy:Math.sin(ang)*player.shotSpeed,r:player.bulletSize,damage:player.damage+(player.coinPower?player.coins*.025:0),life:90,pierce:player.piercing,hit:[]})}sound(340,.045,'triangle',.025)}

function loadCompletion(){try{return JSON.parse(localStorage.getItem('tearboundCompletion')||'{}')}catch(e){return {}}}
function recordCompletion(){let data=loadCompletion(),cid=String(player.character),mode=selectedDifficulty,idx=floor===0||floor===1?0:floor===2||floor===3?1:floor===4||floor===5?2:floor===6||floor===7?3:floor===8?4:floor===9?5:floor===10?6:floor===11?7:8;data[cid]=data[cid]||{};data[cid][mode]=data[cid][mode]||[];if(!data[cid][mode].includes(idx))data[cid][mode].push(idx);try{localStorage.setItem('tearboundCompletion',JSON.stringify(data))}catch(e){}}
function hurt(e,dmg){e.hp-=dmg;e.hit=7;for(let i=0;i<5;i++)particles.push({x:e.x,y:e.y,vx:rand(-2,2),vy:rand(-2,2),life:18,r:rand(2,4),color:'#e7c3a0'});if(e.hp<=0){runStats.kills++;if(e.type==='boss'){recordCompletion();let r=rooms[roomKey(current.x,current.y)];r.cleared=true;pickups.push({x:480,y:300,type:'heart'});pickups.push({x:440,y:330,type:'key'});say('Boss defeated! Find the hatch.')}else if(Math.random()<.34){let roll=Math.random(),type=roll<.25?'coin':roll<.37?'heart':roll<.47?'key':roll<.57?'bomb':roll<.67?'card':roll<.73?'trinket':roll<.80?'soulheart':roll<.85?'nickel':roll<.90?'battery':roll<.95?'sack':'chest';pickups.push({x:e.x,y:e.y,type,value:1,fuse:95,spin:0})}sound(100,.12,'sawtooth') }}
function damagePlayer(){if(player.invuln>0)return;if(player.holyMantle&&player.mantleReady){player.mantleReady=false;player.invuln=75;shake=5;say('HOLY MANTLE!');sound(660,.18,'triangle');return}if(player.armor&&Math.random()<.5){say('The Wafer softened the hit!');player.invuln=35;return}if((player.soulHp||0)>0){player.soulHp--;if(player.blackHearts>0)player.blackHearts=Math.max(0,player.blackHearts-1)}else player.hp--;player.invuln=75;shake=10;sound(90,.2,'sawtooth');if(player.hp<=0){if(player.secondChance){player.secondChance=false;player.hp=2;player.maxHp=Math.max(player.maxHp,2);say('Second chance!');}else{state='dead';showDead()}}}
function arrowFireVector(){let x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),m=Math.hypot(x,y);return m?{x:x/m,y:y/m}:null}
function arrowFireActive(){return !!arrowFireVector()}

function bindFire(id,dx,dy){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.setPointerCapture)b.setPointerCapture(e.pointerId);touchFirePointers.add(e.pointerId);aim.x=dx;aim.y=dy;aim.angle=Math.atan2(dy,dx);mouse.x=(player?player.x:480)+dx*300;mouse.y=(player?player.y:300)+dy*300;b.dataset.pressed='1'});let up=e=>{touchFirePointers.delete(e.pointerId);b.dataset.pressed='0'};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}bindFire('fireUp',0,-1);bindFire('fireDown',0,1);bindFire('fireLeft',-1,0);bindFire('fireRight',1,0);document.getElementById('useBtn').addEventListener('click',()=>{if(player){if(player.card)useCard();else usePill()}});document.getElementById('bombBtn').addEventListener('click',()=>{if(player)useBomb()});document.getElementById('mapBtn').addEventListener('click',()=>{mapOpen=!mapOpen});document.getElementById('pauseBtn').addEventListener('click',()=>{if(state==='play')showPause();else if(state==='pause'){state='play';overlay.classList.add('hidden')}});

document.addEventListener('contextmenu',e=>{if(e.target.closest('#mobileControls')||e.target===canvas)e.preventDefault()});
document.body.classList.toggle('mobile-disabled',!settings.mobileOn);setDisplayMode(settings.displayMode);setPixelated(settings.pixelated!==false);showMenu();requestAnimationFrame(loop);
window.addEventListener('error',e=>{overlay.classList.remove('hidden');let msg=String(e.message||'Unknown error'),where=(e.filename?e.filename.split('/').pop():'')+(e.lineno?':'+e.lineno:'');menu.innerHTML='<div class="logo" style="font-size:34px">TEARBOUND ERROR</div><p class="muted">The game hit an error. Reload the page. If it happens again, send these details.</p><p class="muted" style="overflow-wrap:anywhere">'+(msg+' '+where).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});window.addEventListener('unhandledrejection',e=>{overlay.classList.remove('hidden');menu.innerHTML='<div class="logo">TEARBOUND ERROR</div><p class="muted">'+String(e.reason&&e.reason.message||e.reason||'Unexpected async error').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><button class="btn" onclick="location.reload()">RELOAD GAME</button>'});
})();
</script></body></html>
